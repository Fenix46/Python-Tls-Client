name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Read __version__.py directly instead of importing the tls_client
          # package: importing pulls in sessions.py -> settings.py, which
          # needs typing_extensions installed, an unrelated dependency this
          # version check shouldn't require.
          PKG_VERSION="$(python -c 'exec(open("tls_client/__version__.py").read()); print(__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '${TAG_VERSION}') does not match tls_client/__version__.py ('${PKG_VERSION}')"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
